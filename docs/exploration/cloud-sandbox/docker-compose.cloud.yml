# Cloud-sandbox only (no IPv6 kernel, TLS-intercepting egress, allowlist via host proxy). Not needed on WSL/VPS.
# Host side first: python3 -I cloud/relay.py 35166 <port of $HTTPS_PROXY> &
x-cloud: &cloud
  volumes:
    - ./cache:/usr/src/app/cache
    - ./cloud:/cloud:ro
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    NODE_EXTRA_CA_CERTS: /cloud/ca.crt
    NODE_OPTIONS: --require /cloud/ipv4-listen.cjs
    NODE_USE_ENV_PROXY: "1"
    HTTPS_PROXY: http://host.docker.internal:35166
    HTTP_PROXY: http://host.docker.internal:35166
    NO_PROXY: localhost,127.0.0.1,app,worker,postgres,redis,host.docker.internal
    AP_SANDBOX_PROPAGATED_ENV_VARS: HTTPS_PROXY,HTTP_PROXY,NO_PROXY,NODE_USE_ENV_PROXY,NODE_EXTRA_CA_CERTS
services:
  app:
    <<: *cloud
  worker:
    <<: *cloud
